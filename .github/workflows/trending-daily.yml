name: Daily GitHub Trending

on:
  schedule:
    # 8:01 AM Beijing time (00:01 UTC), one minute after the analytics digest
    - cron: '1 0 * * *'
  workflow_dispatch:

jobs:
  send-trending-daily:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "0.8.x"

    - name: Install dependencies
      run: uv sync

    - name: Run daily trending digest
      env:
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
      run: uv run python src/main.py trending daily
